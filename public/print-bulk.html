<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulk Tickets | CrownBeatz</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --gold: #cfa878;
      --teal: #1abc9c;
      --text: #e6edf3;
      --subtext: #8b949e;
      --border: #cfa878;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #fff; /* For screen preview outside tickets */
    }

    .print-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .ticket {
      display: flex;
      background-color: var(--bg);
      color: var(--text);
      width: 100%;
      height: 250px;
      margin-bottom: 25px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      position: relative;
      page-break-inside: avoid;
    }

    .ticket:nth-child(3n) {
      page-break-after: always;
    }

    .ticket-main {
      flex: 3;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ticket-stub {
      flex: 1;
      padding: 30px 20px;
      border-left: 2px dashed rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Cutouts */
    .ticket-stub::before,
    .ticket-stub::after {
      content: '';
      position: absolute;
      left: -12px;
      width: 24px;
      height: 24px;
      background-color: #fff;
      border-radius: 50%;
      border-right: 2px solid var(--border);
    }
    
    .ticket-stub::before {
      top: -14px;
      transform: rotate(-45deg);
      border-bottom: 2px solid var(--border);
      border-top: none;
      border-left: none;
    }
    
    .ticket-stub::after {
      bottom: -14px;
      transform: rotate(45deg);
      border-top: 2px solid var(--border);
      border-bottom: none;
      border-left: none;
    }

    @media print {
      body { background: #fff; }
      .ticket-stub::before, .ticket-stub::after { background-color: #fff; }
      .print-container { padding: 0; max-width: 100%; }
      .no-print { display: none !important; }
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    
    .brand-subtitle {
      font-size: 10px;
      color: var(--teal);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .event-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .label {
      font-size: 9px;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .ticket {
      width: 1000px;
      height: 562.5px; /* 16:9 aspect ratio */
      margin: 0 auto 30px auto;
      position: relative;
      background-image: url('/images/offline-ticket.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      page-break-inside: avoid;
      overflow: hidden;
      color: #fff;
      font-family: 'Outfit', sans-serif;
    }

    /* Absolute positioning for dynamic overlays on the stub (right side) */
    
    .overlay-category {
      position: absolute;
      top: 8%;
      left: 76%;
      width: 17%;
      height: 12%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .overlay-category-main {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .overlay-category-sub {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #dfa129;
      text-transform: uppercase;
    }

    .overlay-price {
      position: absolute;
      top: 23%;
      left: 76%;
      width: 17%;
      height: 12%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .price-label {
      font-size: 11px;
      font-weight: 700;
      color: #9b51e0; 
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: -5px;
    }
    .price-value {
      font-size: 52px;
      font-weight: 800;
      color: #dfa129;
      letter-spacing: 1px;
    }

    /* Big Ticket QR */
    .overlay-ticket-qr-large {
      position: absolute;
      top: 38%;
      left: 78%;
      width: 13%;
      height: 23%;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 5px;
      box-sizing: border-box;
      border-radius: 6px;
    }

    /* Ticket ID Text Under Big QR */
    .overlay-ticket-id-large {
      position: absolute;
      top: 62%;
      left: 76%;
      width: 17%;
      height: 5%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Container for Map QR and text at bottom */
    .overlay-ticket-info {
      position: absolute;
      top: 69%;
      left: 76%;
      width: 17%;
      height: 22%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 5px;
      box-sizing: border-box;
    }

    /* Small Map QR at the bottom */
    .overlay-map-qr-small {
      width: 75px;
      height: 75px;
      background-image: url('/images/map-qr.png');
      background-size: cover;
      background-position: center;
      margin-bottom: 4px;
      border: 2px solid #fff;
      border-radius: 4px;
    }

    .overlay-ticket-id {
      font-size: 13px;
      font-weight: 600;
      color: #dfa129;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    
    .overlay-type {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .print-btn {
      display: block;
      width: 200px;
      margin: 20px auto;
      padding: 15px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    
    @media print {
      body { margin: 0; padding: 0; background: #fff; }
      .no-print { display: none !important; }
      .ticket { margin: 0 auto; page-break-after: always; zoom: 1; }
      @page { size: landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <button class="print-btn no-print" onclick="window.print()">Print Tickets</button>

  <div class="print-container" id="tickets-container">
    <!-- Tickets will be generated here -->
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ticketsData = JSON.parse(sessionStorage.getItem('bulkTickets') || '[]');
      const container = document.getElementById('tickets-container');

      if (ticketsData.length === 0) {
        container.innerHTML = '<p style="text-align:center; margin-top:50px;">No tickets found. Please generate them from the admin dashboard.</p>';
        return;
      }

      ticketsData.forEach((ticket, index) => {
        const t = document.createElement('div');
        t.className = 'ticket';
        
        let price = parseFloat(ticket.amount).toFixed(0);
        if (price === "0" || isNaN(price)) {
          const prices = {
            general: { couples: 599, adult: 349 },
            silver: { couples: 799, adult: 449 },
            gold: { couples: 1099, adult: 599 },
            family: { pass: 2999 }
          };
          const cat = ticket.category.toLowerCase();
          if (cat === 'family') price = 2999;
          else if (ticket.booking_details && ticket.booking_details.type === 'Couple') {
            price = prices[cat] ? prices[cat].couples : 0;
          } else {
            price = prices[cat] ? prices[cat].adult : 0;
          }
        }
        
        const typeLabel = ticket.booking_details ? ticket.booking_details.type : 'Adult';

        t.innerHTML = `
          <!-- Category covering dummy text -->
          <div class="overlay-category">
            <span class="overlay-category-main">${ticket.category}</span>
            <span class="overlay-category-sub">ADMISSION</span>
          </div>
          
          <!-- Price covering dummy text -->
          <div class="overlay-price">
            <span class="price-label">TICKET PRICE</span>
            <span class="price-value">₹${price}</span>
          </div>
          
          <!-- Big Ticket QR in the middle -->
          <div class="overlay-ticket-qr-large" id="qr-${index}"></div>

          <!-- Ticket ID Text Under Big QR (Covers old "SCAN FOR LOCATION") -->
          <div class="overlay-ticket-id-large">
            <div class="overlay-ticket-id">${ticket.ticket_id}</div>
            <div class="overlay-type">ENTRY FOR ${typeLabel.toUpperCase()}</div>
          </div>
          
          <!-- Info container covering ID and Barcode at bottom -->
          <div class="overlay-ticket-info">
            <!-- Small Map QR -->
            <div class="overlay-map-qr-small"></div>
            <!-- Location Text -->
            <div style="font-size: 9px; font-weight: 600; color: #dfa129; letter-spacing: 1px; margin-top: 2px;">SCAN FOR LOCATION</div>
          </div>
        `;

        container.appendChild(t);

        // Generate Ticket QR code
        new QRCode(document.getElementById(`qr-${index}`), {
          text: ticket.ticket_id,
          width: 120, // Generated size can be slightly larger for crispness
          height: 120,
          colorDark : "#000000",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.M
        });
        
        // Scale QR code to perfectly fit the flex container
        setTimeout(() => {
          const qrCanvas = document.querySelector(`#qr-${index} canvas`);
          const qrImg = document.querySelector(`#qr-${index} img`);
          if (qrCanvas) {
            qrCanvas.style.width = '100%';
            qrCanvas.style.height = '100%';
          }
          if (qrImg) {
            qrImg.style.width = '100%';
            qrImg.style.height = '100%';
          }
        }, 50);
      });
    });
  </script>
</body>
</html>
